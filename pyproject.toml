[build-system]
requires = ["scikit-build-core>=0.8", "pybind11>=3.0.0"]
build-backend = "scikit_build_core.build"

[project]
name = "spatial-adapter"
version = "0.6.0"
description = "Neural spatial modeling with low-rank spatial adapters"
authors = [
    {name = "Wen-Ting Wang", email = "egpivo@gmail.com"},
    {name = "Hao-Yun Huang", email = "hhuscout@gms.ndhu.edu.tw"},
    {name = "Xuan-Chun Wang", email = "wangxc1117@gmail.com"},
]
maintainers = [
    {name = "Wen-Ting Wang", email = "egpivo@gmail.com"},
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.7.0",
    "numpy>=1.21.0",
    "scikit-learn>=1.0.0",
    "optuna>=3.0.0",
    "tqdm>=4.60.0",
    "pyyaml>=6.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "gstools>=1.7.0,<2.0.0",
    "matplotlib>=3.5.0",
    # TensorBoard 2.19.0 + protobuf 4.x: pinned for compatibility.
    # TensorBoard 2.20+ has protobuf 6.x breaking changes.
    "tensorboard==2.19.0",
    "protobuf==4.25.3",
]

[project.optional-dependencies]
vision = [
    "torchvision>=0.20.0",
]
interactive = [
    "ipython>=8.0.0",
    "ipykernel>=6.30.0,<7.0.0",
    "jupyterlab>=4.0.0",
    "seaborn>=0.13.2,<0.14.0",
]
forecasting = [
    "darts==0.36.0",
    "statsforecast==2.0.2",
]
dev = [
    "black>=23.0.0",
    "isort>=5.10.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "nbformat>=5.10.4",
    "bumpversion>=0.6.0",
]
all = [
    "spatial-adapter[vision,interactive,forecasting,dev]",
]

[project.urls]
Homepage = "https://github.com/STLABTW/spatial-adapter"
Repository = "https://github.com/STLABTW/spatial-adapter"
"Bug Tracker" = "https://github.com/STLABTW/spatial-adapter/issues"

# scikit-build-core
# Build backend for the pybind11/CMake C++ extension. Produces a platform
# wheel (spatial_utils.so bundled) so `pip install spatial-adapter` works
# without any system-level CMake/armadillo/openblas install.
#
# CI uses cibuildwheel on top of this to build manylinux + macOS wheels
# across Python versions; see .github/workflows/publish.yml.

[tool.scikit-build]
cmake.build-type = "Release"
cmake.source-dir = "spatial_adapter/cpp_extensions"
# Persistent build dir — required by scikit-build-core whenever
# editable.rebuild = true so CMake can do incremental rebuilds.
build-dir = "build/{wheel_tag}"
# Pure-Python package tree to ship verbatim; C++ artifacts handled by
# CMake's install() target in spatial_adapter/cpp_extensions/CMakeLists.txt.
wheel.packages = ["spatial_adapter"]
# Rebuild the extension automatically on source edits for `pip install -e .`.
editable.rebuild = true

# Poetry (kept for backward compat with conda env scripts)
[tool.poetry]
name = "spatial-adapter"
version = "0.6.0"
description = "Neural spatial modeling with low-rank spatial adapters"
authors = ["Wen-Ting Wang <egpivo@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "spatial_adapter", from = "."}]

[tool.poetry.dependencies]
python = "^3.10"
torch = ">=2.7.0"
numpy = "^1.21.0"
scikit-learn = "^1.0.0"
optuna = "^3.0.0"
tqdm = "^4.60.0"
pyyaml = "^6.0"
gstools = "^1.7.0"
matplotlib = "^3.5.0"
tensorboard = "2.19.0"
protobuf = "4.25.3"
pandas = "^1.3.0"
scipy = ">=1.7.0"

[tool.poetry.group.dev.dependencies]
black = "^23.0.0"
isort = "^5.10.0"
flake8 = "^6.0.0"
mypy = "^1.0.0"
pre-commit = "^3.0.0"
pytest = "^7.0.0"
pytest-cov = "^4.0.0"
nbformat = "^5.10.4"

# Tools
[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=spatial_adapter",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["spatial_adapter"]
omit = ["*/tests/*", "*/test_*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]

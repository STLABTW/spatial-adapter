# Table 4: KAUST ablation — RMSE validation criterion
# Paper: "Ablation on validation criterion (KAUST data, 10/10/80 split)"
# Optuna selects (tau1, tau2) by minimizing val RMSE
# Metrics: Test RMSE, Test CovFrob, Test SV_score
experiment:
  name: kaust_rmse
  seed_start: 1
  n_replications: 100
  n_optuna_trials: 50
  optuna_objective: rmse
  optuna_direction: minimize
  output_dir: results/production/kaust_rmse

data:
  data_dir: data/kaust
  filename: 2b_8.csv
  latent_dim: 80
  space_ratio_keep: 0.1
  train_ratio: 0.1
  val_ratio: 0.1
  test_ratio: 0.8

first_stage:
  # https://github.com/pratiknag/Space-Time.DeepKriging/blob/main/50kSimulation-space-time_DeepKriging.ipynb
  type: stdk
  epochs: 350
  lr: 1.0e-3
  weight_decay: 1.0e-4
  batch_size: 512
  patience: 30

adapter:
  admm:
    rho: 5.0
    dual_momentum: 0.2
    max_iters: 3000
    min_outer: 100
    tol: 1.0e-4
  training:
    lr_mu: 1.0e-3
    batch_size: 128
    pretrain_epochs: 5
  basis:
    phi_every: 5
    phi_freeze: 100
    matrix_reg: 1.0e-6
    irl1_max_iters: 10
    irl1_eps: 1.0e-6
    irl1_tol: 5.0e-4
  tau_range: [1.0e-4, 1.0e+8]

# ─── Tables 7 & 8: Wheat Head patch classification + UQ ─────────
# Paper Table 7: classification metrics across 4 backbones
# Paper Table 8: UQ diagnostics (ResNet-152 only, computed from same run)
# Metrics: Accuracy, AUC, F1, MPIW, CP, ECE
experiment:
  name: wheat_head
  seed_start: 42
  n_replications: 100
  n_optuna_trials: 30
  optuna_objective: accuracy
  optuna_direction: maximize
  output_dir: results/production/wheat_head

data:
  csv_path: data/gwhd/train.csv
  image_dir: data/gwhd/train
  cache_dir: data/gwhd/cache
  latent_dim: 16
  n_locations: 256
  train_ratio: 0.7
  val_ratio: 0.15
  backbones:
    - resnet152
    - convnext_tiny
    - vit_b_16
    - sam_vit_h

adapter:
  admm:
    rho: 5.0
    dual_momentum: 0.2
    max_iters: 200
    min_outer: 50
    tol: 1.0e-4
  training:
    lr_mu: 1.0e-3
    batch_size: 32
    pretrain_epochs: 10
  basis:
    phi_every: 5
    phi_freeze: 100
    matrix_reg: 1.0e-6
    irl1_max_iters: 10
    irl1_eps: 1.0e-6
    irl1_tol: 5.0e-4
  tau_range: [1.0e-4, 1.0e+2]
  task: binary

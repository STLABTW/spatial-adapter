experiment:
  name: kaust
  seed_start: 1
  n_replications: 100
  n_optuna_trials: 50
  output_dir: results/kaust

data:
  data_dir: data/kaust
  filename: 2b_8.csv
  latent_dim: 80       # K = 80 (90% cumulative variance)
  space_ratio_keep: 0.1    # 10% of locations, same as original notebooks
  train_ratio: 0.1
  val_ratio: 0.1
  test_ratio: 0.8

first_stage:
  # Hyperparameters from the official STDK implementation:
  # https://github.com/pratiknag/Space-Time.DeepKriging/blob/main/50kSimulation-space-time_DeepKriging.ipynb
  type: stdk
  epochs: 350           # STDK official: epochs=350
  lr: 1.0e-3            # STDK official: Adam lr=0.001
  weight_decay: 1.0e-4  # STDK official: L2=1e-4
  batch_size: 512       # STDK official: batch_size=512
  patience: 30          # STDK official: EarlyStopping patience=30, monitor val_loss

adapter:
  admm:
    rho: 5.0
    dual_momentum: 0.2
    max_iters: 3000
    min_outer: 100
    tol: 1.0e-4
  training:
    lr_mu: 1.0e-3
    batch_size: 128
    pretrain_epochs: 5
  basis:
    phi_every: 5
    phi_freeze: 100
    matrix_reg: 1.0e-6
    irl1_max_iters: 10
    irl1_eps: 1.0e-6
    irl1_tol: 5.0e-4
  tau_range: [1.0e-4, 1.0e+8]
